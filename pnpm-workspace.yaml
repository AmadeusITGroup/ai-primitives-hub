packages:
  - 'packages/*'
  - 'apps/*'
  - 'github-actions/*'
  - 'lib'
  - 'website'

overrides:
  '@hono/node-server': 2.1.1
  browserslist: ^4.28.7
  fast-uri: ^3.1.6
  js-yaml: ^4.1.1
  mocha>chokidar: ^5.0.0
  mocha>diff: ^9.0.0
  nanoid@<3.3.17: ^6.0.0
  qs: ^6.16.0
  serialize-javascript: ^7.0.7
  uuid: ^14.0.0

engineStrict: true

allowBuilds:
  '@vscode/vsce-sign': true
  'core-js': false
  esbuild: true
  keytar: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@hono/node-server@2.0.10'
  - tar@7.5.21
  - brace-expansion@1.1.17
  - brace-expansion@2.1.3
  - brace-expansion@5.0.8
  - postcss@8.5.23
  - undici@7.29.0
  - undici@6.28.0
  - fast-uri@3.1.7
  - ip-address@10.3.1
  - ip-address@10.2.2
  - ip-address@10.2.1
  - hono@4.12.34
  - brace-expansion@5.0.9
  - brace-expansion@2.1.4
  - brace-expansion@1.1.18
