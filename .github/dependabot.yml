version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/lib"
      - "/website"
      - "/github-actions/validate-collections"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      github-actions-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      github-actions-minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"