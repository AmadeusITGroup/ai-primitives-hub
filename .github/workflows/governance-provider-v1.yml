name: Governance Provider v1 Tests

on:
  pull_request:
    paths:
      - packages/**
      - github-actions/hub-governance-v1/**
      - .github/workflows/*governance*v1.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - eslint.shared.mjs
  push:
    branches: [main]
    paths:
      - packages/**
      - github-actions/hub-governance-v1/**
      - .github/workflows/*governance*v1.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: governance-provider-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout provider implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install provider dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build shared CLI and dependencies
        run: pnpm --filter @ai-primitives-hub/cli... run build

      - name: Test shared validation and governance
        run: pnpm --filter '@ai-primitives-hub/*' run test

      - name: Fix lint for versioned provider files
        run: |
          pnpm -C packages/core exec eslint src/domain/governance/governance-v1.ts test/domain/governance-v1.test.ts --fix
          pnpm -C packages/infra exec eslint src/governance/policy-v1.ts --fix
          pnpm -C packages/app exec eslint src/governance/run-governance-v1.ts src/governance/report-v1.ts test/governance/report-v1.test.ts --fix
          pnpm -C packages/cli exec eslint src/governance-v1.ts test/governance-v1.test.ts test/governance-subjects-v1.test.ts --fix

      - name: Test reporting and workflow contracts
        run: node --test github-actions/hub-governance-v1/test/*.test.cjs