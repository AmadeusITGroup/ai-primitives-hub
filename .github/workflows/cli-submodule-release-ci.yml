name: CLI submodule release checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/cli-submodule-release-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submodule-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@ai-primitives-hub/cli...' build
      - run: pnpm --filter @ai-primitives-hub/infra test test/release-source/node-release-source-reader.test.ts
      - run: pnpm --filter @ai-primitives-hub/cli test test/commands/collection-bundle.test.ts
