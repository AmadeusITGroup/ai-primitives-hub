name: Post Gemma 4 PR Review

# Posts the comment built by "Gemma 4 PR Review". It runs in the base repository with a
# write token, so it never checks out or runs PR code; it only reads the artifact.
on:
  workflow_run:
    # Must match the `name:` of gemma4-pr-review.yml.
    workflows: ["Gemma 4 PR Review"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  post-comment:
    name: Post Gemma 4 review comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download review artifact
        id: artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: gemma4-pr-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: gemma4-pr-review

      - name: Warn if artifact not found
        if: steps.artifact.outcome != 'success'
        run: echo "::warning::No gemma4-pr-review artifact found — skipping comment post."

      - name: Post or update PR comment
        if: steps.artifact.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- gemma4-pr-review -->'

            // Resolve the PR from the trusted head SHA, not the fork-controlled artifact.
            const { owner, repo } = context.repo
            const headSha = context.payload.workflow_run.head_sha
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: headSha })
            const issueNumber = prs.data.find(
              p => p.state === 'open' && p.base.repo.full_name === `${owner}/${repo}`
            )?.number
            if (!issueNumber) {
              core.warning(`No open PR in ${owner}/${repo} associated with ${headSha} — skipping comment post.`)
              return
            }

            let body = fs.readFileSync('gemma4-pr-review/comment.md', 'utf8')
            if (!body.startsWith(marker)) {
              core.warning('Comment body does not start with the gemma4-pr-review marker — skipping comment post.')
              return
            }
            const limit = 60000 // GitHub rejects comments over 65536 characters
            if (body.length > limit) {
              body = body.slice(0, limit) + '\n\n_…truncated._\n\n</details>'
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            })
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body })
            }
