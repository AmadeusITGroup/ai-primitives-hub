name: Apply post-compilation fixes
description: >
  Runs post_compile_fixes.sh (which itself invokes ensure-test-index and
  create-vscode-mock) from the extension working directory. Skipped on Windows.

runs:
  using: composite
  steps:
    - name: Run post-compilation fix scripts
      shell: bash
      working-directory: ${{ env.EXTENSION_DIR }}
      run: |
        script="../../.github/workflows/scripts/post_compile_fixes.sh"
        if [ -f "$script" ]; then
          bash "$script"
        fi
