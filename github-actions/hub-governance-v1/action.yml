name: AI Primitives Hub offline governance v1
description: Install a pinned provider CLI, validate offline, and publish its shared report.
inputs:
  cli-version:
    description: Exact released CLI version containing the governance v1 launcher (not latest).
    required: true
  subject:
    description: hub, collection, or skill. Other primitive kinds are not supported by v1.
    default: hub
  config-path:
    description: Hub configuration path relative to the consumer working directory.
    default: hub-config.yml
  policy-path:
    description: Optional committed governance policy path.
    default: ''
  min-score:
    description: Optional 0-100 threshold; otherwise the score is advisory.
    default: ''
  collection-file:
    description: Optional single collection file; otherwise discover all collections.
    default: ''
  skills-dir:
    description: Skills directory relative to the consumer working directory.
    default: skills
  working-directory:
    description: Consumer repository directory.
    default: ${{ github.workspace }}
  fail-on-error:
    description: Set false only when a caller will enforce the exit-code after reporting.
    default: 'true'
outputs:
  verdict:
    description: pass or fail (includes provider execution failures).
    value: ${{ steps.publish.outputs.verdict }}
  score:
    description: Advisory score; empty if provider setup did not complete.
    value: ${{ steps.publish.outputs.score }}
  exit-code:
    description: Zero only when validation and report generation succeeded.
    value: ${{ steps.publish.outputs.exit-code }}
  report-path:
    description: Absolute path to the provider Markdown report.
    value: ${{ steps.publish.outputs.report-path }}
  result-path:
    description: Absolute path to the structured JSON result.
    value: ${{ steps.publish.outputs.result-path }}
runs:
  using: composite
  steps:
    - name: Prepare isolated provider tools
      id: prepare
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        SUBJECT: ${{ inputs.subject }}
      run: |
        set -euo pipefail
        [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'An exact CLI release version is required.' >&2; exit 1; }
        case "$SUBJECT" in hub|collection|skill) ;; *) echo 'Unsupported validation subject.' >&2; exit 1 ;; esac
        report_dir=$(mktemp -d "$RUNNER_TEMP/hub-governance-v1.XXXXXX")
        echo "report-dir=$report_dir" >> "$GITHUB_OUTPUT"

    - name: Install pinned shared CLI
      id: install
      continue-on-error: true
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        REPORT_DIR: ${{ steps.prepare.outputs.report-dir }}
        NPM_CONFIG_USERCONFIG: /dev/null
      run: |
        set -euo pipefail
        npm install --prefix "$REPORT_DIR/tools" --ignore-scripts --package-lock=false --no-audit --no-fund --registry=https://registry.npmjs.org "@ai-primitives-hub/cli@$CLI_VERSION"

    - name: Run shared offline validation
      if: steps.install.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        SUBJECT: ${{ inputs.subject }}
        CONFIG_PATH: ${{ inputs.config-path }}
        POLICY_PATH: ${{ inputs.policy-path }}
        MIN_SCORE: ${{ inputs.min-score }}
        COLLECTION_FILE: ${{ inputs.collection-file }}
        SKILLS_DIR: ${{ inputs.skills-dir }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        REPORT_DIR: ${{ steps.prepare.outputs.report-dir }}
        PROVIDER_ACTION_PATH: ${{ github.action_path }}
      run: node "$PROVIDER_ACTION_PATH/run-v1.cjs" run

    - name: Publish provider report before enforcing gate
      id: publish
      if: always() && steps.prepare.outcome == 'success'
      shell: bash
      env:
        SUBJECT: ${{ inputs.subject }}
        REPORT_DIR: ${{ steps.prepare.outputs.report-dir }}
        PROVIDER_ACTION_PATH: ${{ github.action_path }}
      run: node "$PROVIDER_ACTION_PATH/run-v1.cjs" publish

    - name: Enforce governance gate
      if: always() && inputs.fail-on-error == 'true'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.publish.outputs.exit-code }}
      run: |
        if [[ "$EXIT_CODE" != '0' ]]; then
          echo 'Provider governance gate failed. See the job summary.' >&2
          exit 1
        fi