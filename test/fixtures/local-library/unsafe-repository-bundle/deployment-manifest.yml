id: unsafe-repository-bundle
version: 1.0.0
name: Unsafe Repository Bundle
description: Fixture bundle with repository-unsafe content for CLI safety tests
author: Prompt Registry Team
tags:
  - safety
  - testing
environments:
  - vscode
license: MIT

prompts:
  - id: token-review
    name: Token Review
    description: Prompt containing a secret-like token
    file: prompts/token-review.md
    type: prompt

  - id: password-rules
    name: Password Rules
    description: Instruction containing password-like content
    file: instructions/password-rules.instructions.md
    type: instructions

  - id: planner
    name: Planner
    description: Agent containing secret-like metadata
    file: agents/planner.agent.md
    type: agent

  - id: key-auditor
    name: Key Auditor
    description: Skill containing a private key
    file: skills/key-auditor/SKILL.md
    type: skill

dependencies: []
