<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="{{cspSource}}">
    <title>AI Primitives Hub</title>
    <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
    <div class="header">
        <h1>🎨 AI Primitives Hub</h1>
        <p>Discover and install curated AI primitives for GitHub Copilot</p>
    </div>

    <div class="search-row">
        <input type="search" class="search-box" id="searchBox"
            placeholder='Search words, "phrases", tag:security, author:name, -excluded'
            aria-label="Search bundles">
        <details class="search-help">
            <summary>Search help</summary>
            <div class="search-help-content">
                <code>two words</code> requires both words. Use <code>"exact phrase"</code>,
                <code>tag:</code>, <code>author:</code>, <code>env:</code>, <code>source:</code>,
                <code>name:</code>, or prefix a term with <code>-</code> to exclude it.
            </div>
        </details>
    </div>

    <div class="controls">
        
        <div class="filter-group">
            <label class="filter-label">Source:</label>
            <div class="source-selector">
                <button class="source-selector-btn" id="sourceSelectorBtn">
                    <span id="sourceSelectorText">All Sources</span>
                    <span class="dropdown-arrow">▾</span>
                </button>
                <div class="source-dropdown" id="sourceDropdown" style="display: none;">
                    <div class="source-search-container">
                        <input type="text" class="source-search" id="sourceSearch" placeholder="Search sources...">
                    </div>
                    <div class="source-list" id="sourceList">
                        <div class="source-item active" data-source="all">
                            <input type="radio" name="source" id="source-all" value="all" checked>
                            <label for="source-all">All Sources</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="filter-group">
            <label class="filter-label">Tags:</label>
            <div class="tag-selector">
                <button class="tag-selector-btn" id="tagSelectorBtn">
                    <span id="tagSelectorText">All Tags</span>
                    <span class="dropdown-arrow">▾</span>
                </button>
                <div class="tag-dropdown" id="tagDropdown" style="display: none;">
                    <div class="tag-search-container">
                        <input type="text" class="tag-search" id="tagSearch" placeholder="Search tags...">
                    </div>
                    <div class="tag-list" id="tagList">
                        <!-- Tags will be populated here -->
                    </div>
                </div>
            </div>
            <select class="filter-select compact-select" id="tagMatchSelect" aria-label="Tag matching mode">
                <option value="any">Match any</option>
                <option value="all">Match all</option>
            </select>
        </div>

        <div class="filter-group">
            <label class="filter-label" for="environmentSelect">Environment:</label>
            <select class="filter-select" id="environmentSelect">
                <option value="all">All environments</option>
            </select>
        </div>

        <div class="filter-group">
            <label class="filter-label" for="sortSelect">Sort:</label>
            <select class="filter-select" id="sortSelect">
                <option value="relevance">Relevance</option>
                <option value="name">Name</option>
                <option value="recent">Recently updated</option>
                <option value="downloads">Downloads</option>
            </select>
        </div>
        
        <div class="installed-filter" id="installedFilter">
            <input type="checkbox" id="installedCheckbox">
            <label for="installedCheckbox">Installed</label>
        </div>
        
        <button class="filter-btn" id="clearFiltersBtn">Clear</button>
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="results-summary" id="resultsSummary" aria-live="polite"></div>

    <div id="marketplace" class="marketplace-grid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading bundles...</p>
        </div>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
