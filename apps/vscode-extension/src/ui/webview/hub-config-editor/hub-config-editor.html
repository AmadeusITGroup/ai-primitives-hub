<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="{{cspSource}}">
    <title>AI Primitives Hub — Visual Configuration Editor</title>
    <link rel="stylesheet" href="{{iconsUri}}">
    <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
    <header>
        <div class="header-left">
            <span class="hub-title" id="hubTitle">Hub Configuration</span>
            <span class="pill info" id="versionPill">v1.0.0</span>
            <span class="pill ok" id="validationPill">✓ Valid</span>
            <span class="pill info" id="prPill" style="display: none;"></span>
        </div>
        <div class="toolbar">
            <button class="secondary" id="btnDeepValidate" type="button">✓ Deep Validate &amp; Load Catalogs</button>
            <button class="secondary" id="btnTouchTimestamp" type="button">🕒 Update Timestamp</button>
            <button class="secondary" id="btnSplitYaml" type="button">⇄ Split YAML View</button>
            <button id="btnSubmitPr" type="button">🚀 Commit &amp; Create PR</button>
        </div>
    </header>

    <div class="workspace">
        <aside>
            <input type="search" id="treeFilter" placeholder="Filter sources or profiles..." aria-label="Filter sources or profiles">
            <div class="tree-list" id="treeContainer"></div>
            <div id="diagnosticsSidebar"></div>
        </aside>
        <main id="inspectorContainer"></main>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
