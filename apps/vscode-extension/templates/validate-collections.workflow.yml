name: Validate Collections

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Collections
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate collections
        id: validate
        run: |
          if npm run validate -- --output-markdown validation-comment.md; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
      
      - name: Post validation results to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: validation-comment.md
          comment-tag: collection-validation
      
      - name: Fail if validation failed
        if: steps.validate.outputs.status == 'failure'
        run: exit 1

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-results
          path: |
            validation-comment.md
            pr-number.txt
            collections/
          if-no-files-found: ignore
