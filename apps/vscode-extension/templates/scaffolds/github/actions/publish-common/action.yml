name: Publish Common Setup
description: Common steps for publish workflow (checkout, tags, node, deps, validate)
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24.x'
outputs:
  validation-status:
    description: Validation status (success or failure)
    value: ${{ steps.validate.outputs.status }}
runs:
  using: composite
  steps:
    - name: Fetch tags
      shell: bash
      run: git fetch --tags --force

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}

    - name: Validate collections
      id: validate
      shell: bash
      run: |
        if npm run validate -- --markdown-path validation-comment.md > validation.log 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
        fi

    - name: Upload validation results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: validation-results
        path: |
          validation-comment.md
          validation.log
          pr-number.txt
          collections/
        if-no-files-found: ignore
